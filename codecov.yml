coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        target: 70%
        threshold: 5%
        base: auto

    patch:
      default:
        target: 70%
        threshold: 5%

comment:
  layout: "reach,diff,flags,tree,footer"
  behavior: default
  require_changes: false

ignore:
  - "test/**/*"
  - "scripts/**/*"
  - "deploy/**/*"
  - "typechain-types/**/*"
  - "node_modules/**/*"
  - "artifacts/**/*"
  - "cache/**/*"
  - "coverage/**/*"
  - "**/*.config.js"
  - "**/*.config.ts"

flags:
  unittests:
    paths:
      - contracts/
    carryforward: true
